name: CI

on:
  push:
    branches: [main, wp00/g2-schema-decisions]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── Frontend: typecheck + tests + build ───
  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck (app)
        run: npm run typecheck:app

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Coverage
        run: npm run test:coverage

  # ─── Backend: Go tests ───
  # The suite hardcodes `postgres:5432` as the DB host in 37 *_test.go files,
  # expecting to run *inside* the Docker network where that alias resolves. So we
  # run go test inside a container on a user-defined network, mirroring the
  # project's Makefile `test` target — not on the runner host (where `postgres`
  # is unresolvable and `pg_isready -h localhost` would hang forever).
  #
  # BLOCKING application test gate. A deterministic repository-derived P0
  # fixture provisions the database so the backend suites execute. It is not
  # P1/P2/P3 evidence and does not claim G2/G3, install, or upgrade authority.
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WP-01 G1 adds one host-side migration proof in this existing Backend
      # context because the normal Go-suite container does not receive the host
      # Docker socket and therefore cannot run the Docker-spawning migration
      # fixture. This does not create a new required status context.
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: WP-01 G1 live forward target rehearsal
        working-directory: services/api
        run: |
          go test -p 1 -count=1 -timeout 300s \
            ./internal/migration -run '^TestForwardManifestProbe$' -v

      - name: Create test network
        run: docker network create clarityit-net

      - name: Start Postgres
        run: |
          docker run -d --name postgres --network clarityit-net \
            --network-alias postgres \
            -e POSTGRES_USER=clarityit \
            -e POSTGRES_PASSWORD=clarityit \
            -e POSTGRES_DB=clarityit \
            -p 5432:5432 \
            postgres:16-alpine

      - name: Wait for Postgres (bounded)
        run: |
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U clarityit >/dev/null 2>&1; then
              echo "Postgres ready"
              exit 0
            fi
            echo "waiting for Postgres ($i/30)..."
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          docker logs postgres
          exit 1

      - name: Build repository-derived P0 test schema
        run: |
          python3 scripts/build-ci-p0-schema.py --output /tmp/clarityit-ci-p0.sql

      - name: Bootstrap P0 test role
        run: |
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < migrations/ci/p0/bootstrap.sql

      - name: Apply repository-derived P0 test schema
        run: |
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < /tmp/clarityit-ci-p0.sql

      - name: Verify P0 test schema
        run: |
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < migrations/ci/p0/verify.sql

      - name: Seed deterministic backend test principals
        run: |
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < migrations/ci/p0/seed.sql

      - name: Run context-worker tests
        run: |
          docker volume create clarityit-go-mod
          docker volume create clarityit-go-build
          docker run --rm \
            -v "$PWD/services/api:/app" \
            -v clarityit-go-mod:/go/pkg/mod \
            -v clarityit-go-build:/root/.cache/go-build \
            -w /app \
            --network clarityit-net \
            golang:1.25-alpine \
            go test -p 1 -count=1 -timeout 60s ./cmd/context-worker/...

      - name: Reset P0 test database for admin tests
        run: |
          docker exec postgres psql -U clarityit -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE clarityit WITH (FORCE)"
          docker exec postgres createdb -U clarityit clarityit
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < /tmp/clarityit-ci-p0.sql
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < migrations/ci/p0/verify.sql
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < migrations/ci/p0/seed.sql

      - name: Run admin tests
        run: |
          docker run --rm \
            -v "$PWD/services/api:/app" \
            -v clarityit-go-mod:/go/pkg/mod \
            -v clarityit-go-build:/root/.cache/go-build \
            -w /app \
            --network clarityit-net \
            golang:1.25-alpine \
            go test -p 1 -count=1 -timeout 60s ./internal/admin/...

      - name: Reset P0 test database for full Go tests
        run: |
          docker exec postgres psql -U clarityit -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE clarityit WITH (FORCE)"
          docker exec postgres createdb -U clarityit clarityit
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < /tmp/clarityit-ci-p0.sql
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < migrations/ci/p0/verify.sql
          docker exec -i postgres psql -U clarityit -d clarityit -v ON_ERROR_STOP=1 \
            < migrations/ci/p0/seed.sql

      - name: Run full Go tests
        run: |
          docker run --rm \
            -v "$PWD/services/api:/app" \
            -v clarityit-go-mod:/go/pkg/mod \
            -v clarityit-go-build:/root/.cache/go-build \
            -w /app \
            --network clarityit-net \
            golang:1.25-alpine \
            go test -p 1 -count=1 -timeout 600s ./...

      - name: Run profiler unit tests (13) + migration_state integration tests (3) + P3 validation
        run: |
          pip install psycopg2-binary
          python scripts/profile/test_capture_schema.py
          # migration_state integration test needs a PG on the network
          docker run --rm \
            -v "$PWD/scripts/profile:/app" \
            -w /app \
            --network clarityit-net \
            -e PGPASSWORD=clarityit \
            -e DB_HOST=postgres \
            -e DB_AVAILABLE=1 \
            python:3.12-slim \
            sh -c "pip install -q psycopg2-binary 2>/dev/null; python test_migration_state.py"
          # P3 validation: verify against committed golden-manifest.json
          python scripts/profile/validate_p3.py

      - name: G2 fixture validation (016/018/029 against P0 schema)
        run: |
          bash scripts/profile/validate_g2.sh

  # ─── Python worker ───
  worker:
    name: Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workers/reasoning
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Tests
        run: pytest -q
